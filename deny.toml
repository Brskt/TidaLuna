[advisories]
version = 2
unmaintained = "none"
yanked = "warn"
# quick-xml DoS advisories via dash-mpd, which does not allow the fixed 0.41
# yet. Drop when dash-mpd bumps quick-xml.
ignore = ["RUSTSEC-2026-0194", "RUSTSEC-2026-0195"]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# cpal pinned to the PR #1183 merge for native default-device auto-rerouting (pre-0.18).
allow-git = ["https://github.com/RustAudio/cpal"]
