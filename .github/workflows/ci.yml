name: CI

on:
  push:
    branches: [lunar-cef]
  pull_request:
    branches: [lunar-cef]
  # Promotion: publish the latest dev prerelease as a public release. The
  # version defaults to the dev's base (X.Y.Z-alpha.dev.N -> X.Y.Z-alpha);
  # filling the input overrides it (phase jumps: -alpha to -beta to bare).
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (empty = base of the latest dev build)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only; pushes finish, keeping their cache save from eviction.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Version
  # ---------------------------------------------------------------------------

  # Resolves the version this run builds and publishes.
  # - push: next dev build (latest public release, patch+1 keeping its phase
  #   label, then the next free .dev.N counter). The workflow-level concurrency
  #   group serializes pushes: two runs can never mint the same N.
  # - workflow_dispatch: the promoted version (input or the latest dev's base)
  #   plus the commit of the latest dev prerelease as the build ref.
  # - pull_request: no version, nothing publishes.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      kind: ${{ steps.resolve.outputs.kind }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            echo "kind=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_public=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          echo "Latest public release: $latest_public"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            latest_dev=$(gh api "repos/$REPO/releases?per_page=100" \
              --jq '[.[] | select(.prerelease and (.draft | not))][0].tag_name // empty')
            if [ -n "$INPUT_VERSION" ]; then
              version="$INPUT_VERSION"
            elif [ -n "$latest_dev" ]; then
              # Strip the dev suffix in either separator form (labeled bases use
              # .dev.N, bare bases use -dev.N to stay valid SemVer).
              case "$latest_dev" in
                *.dev.*) version="${latest_dev%.dev.*}" ;;
                *-dev.*) version="${latest_dev%-dev.*}" ;;
                *) version="$latest_dev" ;;
              esac
            else
              echo "No dev prerelease to promote and no version given" >&2
              exit 1
            fi
            # SemVer precedence, not sort -V: a bare release must beat its own
            # prerelease (X.Y.Z > X.Y.Z-pre). Validates both args.
            if ! python3 - "$latest_public" "$version" <<'PY'
          import re, sys
          SEMVER_RE = re.compile(
              r'^(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)'
              r'(?:-(?P<pre>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?'
              r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          )
          def key(v):
              m = SEMVER_RE.match(v)
              if not m:
                  sys.exit(f"invalid semver: {v}")
              core = (int(m['major']), int(m['minor']), int(m['patch']))
              if m['pre'] is None:
                  return (core, (1,))
              def ident(i):
                  return (0, int(i)) if i.isdigit() else (1, i)
              return (core, (0, tuple(ident(i) for i in m['pre'].split('.'))))
          sys.exit(0 if key(sys.argv[2]) > key(sys.argv[1]) else 1)
          PY
            then
              echo "Version $version is not newer than $latest_public" >&2
              exit 1
            fi
            # Build the bits that were tested: the latest dev's commit.
            ref=""
            if [ -n "$latest_dev" ]; then
              ref=$(gh api "repos/$REPO/git/ref/tags/$latest_dev" --jq .object.sha)
            fi
            {
              echo "kind=promote"
              echo "version=$version"
              echo "ref=$ref"
            } >> "$GITHUB_OUTPUT"
            echo "Promoting to $version (ref: ${ref:-branch head})"
            exit 0
          fi

          # push: next dev build toward the version after the latest public.
          core=${latest_public%%-*}
          label=${latest_public#"$core"}
          patch=${core##*.}
          base="${core%.*}.$((patch + 1))${label}"
          # A labeled base extends its prerelease (X.Y.Z-alpha.dev.N); a bare
          # base needs the hyphen to stay valid SemVer (X.Y.Z-dev.N).
          if [ -n "$label" ]; then sep='.' sep_re='\.'; else sep='-' sep_re='-'; fi
          esc=$(printf '%s' "$base" | sed 's/[.[\*^$]/\\&/g')
          last_n=$(gh api "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' \
            | { grep -E "^${esc}${sep_re}dev\.[0-9]+$" || true; } \
            | sed "s/^.*${sep_re}dev\.//" | sort -n | tail -1)
          version="${base}${sep}dev.$(( ${last_n:-0} + 1 ))"
          {
            echo "kind=dev"
            echo "version=$version"
            echo "ref="
          } >> "$GITHUB_OUTPUT"
          echo "Next dev build: $version"

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: build-essential pkg-config libasound2-dev libdbus-1-dev libx11-dev libglib2.0-dev libgdk-pixbuf-2.0-dev cmake ninja-build
          version: "1"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install lint tools
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,cargo-deny,typos-cli

      - name: Write TIDAL Connect private key
        env:
          TIDAL_SERVER_KEY_PEM: ${{ secrets.TIDAL_SERVER_KEY_PEM }}
        run: printf '%s' "$TIDAL_SERVER_KEY_PEM" > src/connect/ws/certs/tidal_server_key.pem

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/lunar-cef' }}

      - name: Cache Bun + frontend deps
        uses: actions/cache@v5
        with:
          path: |
            .cache/bun
            frontend/node_modules
          key: js-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            js-${{ runner.os }}-${{ runner.arch }}-

      - name: Check TOML formatting
        run: taplo fmt --check
      - name: Check Rust formatting
        run: cargo xtask fmt
      - name: Check typos
        run: typos
      - name: Clippy
        run: cargo xtask clippy
      - name: Deny check
        run: cargo deny check advisories bans sources

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-amd64
            os: windows-2022
          - target: windows-arm64
            os: windows-11-arm
          - target: macos-arm64
            os: macos-latest
          - target: macos-x64
            os: macos-26-intel
    runs-on: ${{ matrix.os }}
    env:
      # Job-scoped for the Sign step's `if: env.WINDOWS_SIGNING_PFX != ''` to
      # see the value (GitHub's documented secret-gating pattern).
      WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
      WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Promotion builds the latest dev's commit; otherwise the event ref.
          ref: ${{ needs.version.outputs.ref }}

      - name: Stamp release version
        if: needs.version.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Workspace-only stamp (never committed): binaries, manifests and the
          # signed update metadata all self-identify as the published version.
          # python3 because the runners split GNU/BSD sed; fails closed if the
          # manifest ever grows a second top-level version line.
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("Cargo.toml")
          text = path.read_text()
          pattern = re.compile(r'(?m)^version = ".*"')
          if len(pattern.findall(text)) != 1:
              sys.exit("expected exactly one top-level version line in Cargo.toml")
          path.write_text(pattern.sub(f'version = "{version}"', text, count=1))
          PY
          grep -q "version = \"$VERSION\"" Cargo.toml

      - name: Install system dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: build-essential pkg-config libasound2-dev libdbus-1-dev libx11-dev libglib2.0-dev libgdk-pixbuf-2.0-dev cmake ninja-build dpkg-dev
          version: "1"

      - name: Install Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned, sha256-checked Ninja binary; far faster than the choco engine.
          $ver = '1.13.2'
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $asset = 'ninja-winarm64.zip'
            $sha = 'e52f0bdef9dfb1003229dbd6508a508c4073fd017247002adc66e5e806cb0391'
          } else {
            $asset = 'ninja-win.zip'
            $sha = '07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'ninja.zip'
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$ver/$asset" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $sha) { throw "ninja $asset sha256 mismatch: got $actual" }
          $dst = Join-Path $env:RUNNER_TEMP 'ninja'
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $dst | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Write TIDAL Connect private key
        env:
          TIDAL_SERVER_KEY_PEM: ${{ secrets.TIDAL_SERVER_KEY_PEM }}
        shell: bash
        run: printf '%s' "$TIDAL_SERVER_KEY_PEM" > src/connect/ws/certs/tidal_server_key.pem

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/lunar-cef' }}

      - name: Cache Bun + frontend deps
        uses: actions/cache@v5
        with:
          path: |
            .cache/bun
            frontend/node_modules
          key: js-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            js-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and bundle
        run: cargo xtask bundle --release

      - name: Build updater
        if: runner.os != 'macOS'
        run: cargo xtask build-updater --release

      - name: Package Linux installers
        if: startsWith(matrix.target, 'linux-')
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          arch=$([ "$MATRIX_TARGET" = 'linux-amd64' ] && echo amd64 || echo arm64)
          cargo xtask package --release --arch "$arch" --target linux-deb
          cargo xtask package --release --arch "$arch" --target linux-tarball

      - name: Smoke test .deb (install + layout + purge)
        if: startsWith(matrix.target, 'linux-')
        run: |
          deb=$(ls target/installer/tidalunar_*.deb | head -1)
          sudo apt-get install -y "./$deb"
          test -x /usr/bin/tidalunar.real || { echo "launcher missing"; exit 1; }
          test -e /usr/bin/tidalunar || { echo "alternatives symlink missing"; exit 1; }
          test -f /opt/tidalunar/bin/cef/chrome-sandbox || { echo "chrome-sandbox missing"; exit 1; }
          test -f /etc/apparmor.d/tidalunar || { echo "apparmor profile missing"; exit 1; }
          test -f /usr/lib/tidalunar/payload.tar.zst || { echo "payload missing"; exit 1; }
          test -f /usr/share/applications/tidalunar.desktop || { echo "desktop entry missing"; exit 1; }
          proto=$(cat /usr/lib/tidalunar/SANDBOX_PROTOCOL_VERSION)
          [ "$proto" = "1" ] || { echo "unexpected protocol version: $proto"; exit 1; }
          sudo dpkg -P tidalunar
          test ! -e /usr/bin/tidalunar.real || { echo "purge left launcher behind"; exit 1; }

      - name: Install NSIS
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          # Pinned, sha256-checked NSIS; far faster than choco, and WS2025 no longer preinstalls it.
          # curl.exe, not Invoke-WebRequest: SourceForge serves its download page to a
          # browser-like user agent, and the pinned hash then fails on html.
          $sha = '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
          $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          curl.exe -sSL --fail --proto '=https' --proto-redir '=https' -o $zip 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip'
          if ($LASTEXITCODE -ne 0) { throw "nsis download failed: curl exit $LASTEXITCODE" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $sha) { throw "nsis zip sha256 mismatch: got $actual" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          "$env:RUNNER_TEMP\nsis-3.12" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Fetch 7zr.exe extractor (sha256-pinned)
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          # Official 7-Zip standalone extractor, embedded in the installer to
          # unpack the payload.7z that `cargo xtask package` builds. 7-Zip ships
          # no Authenticode signature; fetch a versioned release asset (the
          # floating 7-zip.org/a/7zr.exe changes content on every 7-Zip release)
          # and pin its SHA-256. Bump version and hash together, deliberately.
          $dst = Join-Path $env:RUNNER_TEMP '7zr.exe'
          Invoke-WebRequest -Uri 'https://github.com/ip7z/7zip/releases/download/26.02/7zr.exe' -OutFile $dst
          $expected = '56B8CC9F4971CEF253644FAFE54063ED7FDCA551D4DEE0F8C6BAA81B855ACD72'
          $actual = (Get-FileHash $dst -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "7zr.exe sha256 mismatch: got $actual" }
          "TIDALUNAR_7ZR_EXE=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package Windows installer
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          $arch = if ($env:MATRIX_TARGET -eq 'windows-amd64') { 'amd64' } else { 'arm64' }
          cargo xtask package --release --arch $arch

      - name: Sign Windows installer
        if: startsWith(matrix.target, 'windows-') && env.WINDOWS_SIGNING_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX))
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
            /f "$env:RUNNER_TEMP\cert.pfx" `
            /p "$env:WINDOWS_SIGNING_PFX_PASSWORD" `
            /tr http://timestamp.digicert.com `
            /td sha256 /fd sha256 `
            target\installer\tidalunar_*.exe
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      - name: Smoke test installer (silent install)
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          $installer = Get-ChildItem target\installer\tidalunar_*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\TidaLunar\tidalunar.exe")) {
            throw "Installer ran but tidalunar.exe missing in install dir"
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\TidaLunar\updater.exe")) {
            throw "Installer ran but updater.exe missing in install dir"
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\TidaLunar\manifest.json")) {
            throw "Installer ran but manifest.json missing in install dir"
          }
          if (-not (Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TidaLunar" -ErrorAction SilentlyContinue)) {
            throw "Installer ran but registry entry missing"
          }
          Start-Process -FilePath "$env:LOCALAPPDATA\Programs\TidaLunar\Uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 2
          if (Test-Path "$env:LOCALAPPDATA\Programs\TidaLunar\tidalunar.exe") {
            throw "Uninstaller ran but tidalunar.exe still present"
          }

      - name: Smoke test cleanup-stale helper
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'cleanup-fixture'
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          'old-only' | Out-File "$fixture\removed.dat" -Encoding ascii
          'shared'   | Out-File "$fixture\kept.dat"    -Encoding ascii
          @{
            version = '0.0.1'; min_version = '0.0.0'; target = 'windows-amd64';
            files = @{ 'removed.dat' = @{ sha256='00'; size=8 }; 'kept.dat' = @{ sha256='00'; size=6 } }
          } | ConvertTo-Json -Depth 4 | Out-File "$fixture\old.json" -Encoding ascii
          @{
            version = '0.0.2'; min_version = '0.0.0'; target = 'windows-amd64';
            files = @{ 'kept.dat' = @{ sha256='00'; size=6 } }
          } | ConvertTo-Json -Depth 4 | Out-File "$fixture\new.json" -Encoding ascii

          & dist\updater.exe --cleanup-stale --app-dir $fixture --old-manifest "$fixture\old.json" --new-manifest "$fixture\new.json"
          if ($LASTEXITCODE -ne 0) { throw "cleanup-stale exited $LASTEXITCODE" }
          if (Test-Path "$fixture\removed.dat") { throw "cleanup-stale did not remove old-only file" }
          if (-not (Test-Path "$fixture\kept.dat")) { throw "cleanup-stale removed a still-current file" }

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: tidalunar-${{ matrix.target }}
          path: dist/

      - name: Upload installer artifact
        if: startsWith(matrix.target, 'windows-')
        uses: actions/upload-artifact@v7
        with:
          name: tidalunar-${{ matrix.target }}-installer
          path: target/installer/tidalunar_*.exe

      - name: Upload installer artifact (Linux)
        if: startsWith(matrix.target, 'linux-')
        uses: actions/upload-artifact@v7
        with:
          name: tidalunar-${{ matrix.target }}-installer
          path: |
            target/installer/tidalunar_*.deb
            target/installer/tidalunar_*_linux_*.tar.gz

  # ---------------------------------------------------------------------------
  # Nix flake
  # ---------------------------------------------------------------------------

  nix-check:
    # One runner per system: `nix flake check` omits whatever the machine cannot
    # build, leaving aarch64-linux unverified under a lone Linux runner, the
    # arm64 release hash with it. The darwin pair idles until `systems` names it.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # x86_64-linux
          - ubuntu-24.04-arm # aarch64-linux
          - macos-latest # aarch64-darwin
          - macos-26-intel # x86_64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # One runner is enough: formatting does not depend on the platform.
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          nix fmt
          git diff --exit-code

      # Validates the flake (eval all outputs, build the currently-pinned
      # release package + devShell). Guards against nixpkgs drift / flake typos;
      # it checks the last released version, not the one being released.
      - name: Flake check
        run: nix flake check -L

  # ---------------------------------------------------------------------------
  # Check
  # ---------------------------------------------------------------------------

  check:
    if: always()
    needs:
      - lint
      - build
      - nix-check
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs green
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------

  # Publishes every green push as a dev prerelease, and a workflow_dispatch as
  # the promoted public release (see the version job for how each is resolved).
  release:
    needs: [check, version]
    if: needs.version.outputs.kind != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --dir artifacts/

      - name: Install signing dependency
        run: pip install cryptography

      - name: Prepare and sign release assets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          KIND: ${{ needs.version.outputs.kind }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets

          for target in linux-amd64 linux-arm64 windows-amd64 windows-arm64 macos-arm64 macos-x64; do
            dir="artifacts/tidalunar-${target}"
            if [ ! -d "$dir" ]; then
              echo "Warning: $dir not found, skipping"
              continue
            fi

            if [ -f "$dir/manifest.json" ]; then
              cp "$dir/manifest.json" "release-assets/manifest-${target}.json"
            fi

            # Consecutive delta: diff this build against the previous release's
            # manifest, ship only changed files, and stamp delta_from BEFORE
            # signing (so the signature covers it). macOS is not an updater
            # target and is skipped.
            case "$target" in
              windows-amd64) dtarget=win32; darch=amd64; dasset="tidalunar_${VERSION}_update_win32_x64.zip" ;;
              windows-arm64) dtarget=win32; darch=arm64; dasset="tidalunar_${VERSION}_update_win32_arm64.zip" ;;
              linux-amd64)   dtarget=linux; darch=amd64; dasset="tidalunar_${VERSION}_update_linux_amd64.tar.gz" ;;
              linux-arm64)   dtarget=linux; darch=arm64; dasset="tidalunar_${VERSION}_update_linux_arm64.tar.gz" ;;
              *)             dtarget="" ;;
            esac
            if [ -n "$dtarget" ] && [ -f "release-assets/manifest-${target}.json" ]; then
              # Delta base: dev builds chain onto the newest release of any
              # kind (usually the previous dev); a promotion diffs against the
              # newest public release, since that is what stable users run.
              if [ "$KIND" = "promote" ]; then
                prev_filter='select(.tagName != env.VERSION and .isDraft == false and .isPrerelease == false)'
              else
                prev_filter='select(.tagName != env.VERSION and .isDraft == false)'
              fi
              prev_tag=$(gh release list --limit 30 --json tagName,isDraft,isPrerelease \
                --jq "[.[] | $prev_filter] | .[0].tagName" 2>/dev/null || true)
              prev_dir="/tmp/prev-${target}"
              if [ -n "$prev_tag" ] && \
                 gh release download "$prev_tag" --pattern "manifest-${target}.json" \
                   --dir "$prev_dir" --clobber 2>/dev/null \
                 && [ -f "$prev_dir/manifest-${target}.json" ]; then
                # Delta build is best-effort: failure or an empty diff falls back
                # to full-archive-only (no delta_from stamp), never aborts release.
                if cargo xtask delta --target "$dtarget" --arch "$darch" \
                     --old-manifest "$prev_dir/manifest-${target}.json" --dist "$dir" \
                   && [ -f "target/installer/$dasset" ]; then
                  cp "target/installer/$dasset" "release-assets/$dasset"
                  tmp=$(mktemp)
                  jq --arg v "$prev_tag" '.delta_from = $v' \
                    "release-assets/manifest-${target}.json" > "$tmp" \
                    && mv "$tmp" "release-assets/manifest-${target}.json"
                  echo "Built delta for $target from $prev_tag -> $dasset"
                else
                  echo "Delta build skipped/failed for $target; full archive only"
                fi
              else
                echo "No previous release manifest for $target; shipping full archive only"
              fi
            fi

            if [ -n "$UPDATE_SIGNING_KEY" ] && [ -f "release-assets/manifest-${target}.json" ]; then
              python3 scripts/sign-manifest.py "release-assets/manifest-${target}.json"
            fi

            # Bundle archive = both the human portable download and the updater
            # payload. Windows ships a flat .zip; Linux uses the .tar.gz emitted
            # by `cargo xtask package` (copied below): no zip there. macOS is
            # not an updater target and keeps its plain bundle zip.
            case "$target" in
              windows-amd64) bundle_zip="tidalunar_${VERSION}_win32_x64.zip" ;;
              windows-arm64) bundle_zip="tidalunar_${VERSION}_win32_arm64.zip" ;;
              macos-arm64)   bundle_zip="tidalunar_${VERSION}_macos_arm64.zip" ;;
              macos-x64)     bundle_zip="tidalunar_${VERSION}_macos_x64.zip" ;;
              *)             bundle_zip="" ;;
            esac
            if [ -n "$bundle_zip" ]; then
              (cd "$dir" && zip -r "$GITHUB_WORKSPACE/release-assets/$bundle_zip" .)
              echo "Created $bundle_zip"
            fi

            case "$target" in
              windows-*)
                inst_dir="artifacts/tidalunar-${target}-installer"
                if [ -d "$inst_dir" ]; then
                  installer=$(ls "$inst_dir"/tidalunar_*.exe 2>/dev/null | head -1)
                  if [ -n "$installer" ]; then
                    cp "$installer" "release-assets/$(basename "$installer")"
                    echo "Copied installer: $(basename "$installer")"
                  fi
                fi
                ;;
              linux-*)
                inst_dir="artifacts/tidalunar-${target}-installer"
                if [ -d "$inst_dir" ]; then
                  for f in "$inst_dir"/tidalunar_*.deb "$inst_dir"/tidalunar_*_linux_*.tar.gz; do
                    [ -f "$f" ] || continue
                    cp "$f" "release-assets/$(basename "$f")"
                    echo "Copied installer: $(basename "$f")"
                  done
                fi
                ;;
            esac
          done

          ls -la release-assets/

      # Default body: a download table over the assets actually produced, plus
      # a compare link against the latest public release (what a stable user
      # runs). Curated notes get added by hand on promotions (Update release).
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          PREV=$(gh api "repos/$REPO/releases/latest" --jq .tag_name || true)
          export PREV
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          prev = os.environ.get("PREV", "")
          download = f"https://github.com/{repo}/releases/download/{version}"
          rows = [
              ("Windows x64", f"tidalunar_{version}_x64.exe", f"tidalunar_{version}_win32_x64.zip"),
              ("Windows arm64", f"tidalunar_{version}_arm64.exe", f"tidalunar_{version}_win32_arm64.zip"),
              ("Linux amd64", f"tidalunar_{version}_amd64.deb", f"tidalunar_{version}_linux_amd64.tar.gz"),
              ("Linux arm64", f"tidalunar_{version}_arm64.deb", f"tidalunar_{version}_linux_arm64.tar.gz"),
              ("macOS x64", None, f"tidalunar_{version}_macos_x64.zip"),
              ("macOS arm64", None, f"tidalunar_{version}_macos_arm64.zip"),
          ]
          assets = {p.name for p in Path("release-assets").iterdir()}
          table, refs = [], []

          def cell(name, ref):
              if name is None or name not in assets:
                  return ""
              refs.append(f"[{ref}]: {download}/{name}")
              return f"[{name}][{ref}]"

          for i, (platform, installer, portable) in enumerate(rows):
              a = cell(installer, f"i{i}")
              b = cell(portable, f"p{i}")
              if a or b:
                  table.append(f"| {platform} | {a} | {b} |")

          body = ["## Downloads", "", "| Platform | Installer | Portable |", "|:---|:---|:---|"]
          body += table + [""] + refs
          if prev:
              body += ["", "## Changes", f"https://github.com/{repo}/compare/{prev}...{version}"]
          Path("release-notes.md").write_text("\n".join(body) + "\n")
          PY
          cat release-notes.md

      - name: Create GitHub Release
        env:
          # Not GITHUB_TOKEN: tagging a commit whose workflow files differ from the branch
          # tip needs `workflows: write`, which no `permissions:` key can grant.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG_NAME: ${{ needs.version.outputs.version }}
          KIND: ${{ needs.version.outputs.kind }}
          BUILD_REF: ${{ needs.version.outputs.ref }}
        run: |
          # Dev builds publish immediately as prereleases (only the dev update
          # channel sees them); a promotion publishes a plain public release.
          target=${BUILD_REF:-$GITHUB_SHA}
          if [ "$KIND" = "promote" ]; then
            flag=""
          else
            flag="--prerelease"
          fi
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file release-notes.md \
            --target "$target" \
            $flag \
            release-assets/*

      - name: Install cargo-edit
        if: needs.version.outputs.kind == 'promote'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      # Keep the repo's version aligned with the latest public release. Local
      # builds then self-identify correctly. cargo set-version updates Cargo.toml and
      # the lockfile coherently; [skip ci] avoids a run whose only diff is the
      # bump.
      - name: Bump the repo and the Nix package to the released version
        if: needs.version.outputs.kind == 'promote'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git fetch origin lunar-cef
          git checkout lunar-cef
          cargo set-version --package tidalunar "$VERSION"
          # nix/package.nix names a version only once its tarball exists. The
          # hashes come from release-assets/, which the checkout leaves alone.
          sed -i "s|^  version = \".*\";|  version = \"$VERSION\";|" nix/package.nix
          grep -Fq "version = \"$VERSION\";" nix/package.nix
          for pair in x86_64-linux:amd64 aarch64-linux:arm64; do
            tarball="release-assets/tidalunar_${VERSION}_linux_${pair#*:}.tar.gz"
            [ -f "$tarball" ] || { echo "::error::missing $tarball"; exit 1; }
            sri="sha256-$(openssl dgst -sha256 -binary "$tarball" | base64 -w0)"
            # Addressed to the arch's own block: the two hashes cannot swap.
            sed -i "/\"${pair%:*}\" = {/,/};/ s|hash = \"sha256-[^\"]*\";|hash = \"$sri\";|" nix/package.nix
            # Matched whole, since a truncated `sha256-` would be a prefix of any hash.
            grep -Fq "hash = \"$sri\";" nix/package.nix
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to $VERSION [skip ci]"
          git push origin lunar-cef
